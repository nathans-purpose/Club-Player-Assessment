name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, unit and RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  db-push:
    # Production gets its schema through `supabase db push` (deploy-database.yml),
    # which runs as the postgres role on an empty database. This repeats that
    # against a fresh local stack so a migration that only works locally fails here.
    name: Migrations apply with db push
    runs-on: ubuntu-latest
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start an empty Supabase stack
        run: |
          mkdir -p "$RUNNER_TEMP/empty/supabase"
          sed -e 's/^project_id = .*/project_id = "empty"/' -e 's/^sql_paths = .*/sql_paths = []/' supabase/config.toml > "$RUNNER_TEMP/empty/supabase/config.toml"
          cp -r supabase/templates "$RUNNER_TEMP/empty/supabase/"
          cd "$RUNNER_TEMP/empty"
          "$GITHUB_WORKSPACE/node_modules/.bin/supabase" start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
      - name: Push migrations
        run: npx supabase db push --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Check storage buckets
        run: |
          buckets="$(docker exec supabase_db_empty psql -U postgres -tAc "select string_agg(id, ',' order by id) from storage.buckets")"
          echo "$buckets"
          test "$buckets" = "brand-imports,club-assets,club-crests,player-imports"

  e2e:
    name: End-to-end (local Supabase)
    runs-on: ubuntu-latest
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      # The player import talks to e2e/mock-anthropic.mjs, started by Playwright.
      ANTHROPIC_BASE_URL: http://127.0.0.1:4010
      ANTHROPIC_API_KEY: e2e-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
      - name: Build and start the app
        run: |
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$(npx supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')"
          npm run build
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/logga-in >/dev/null && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
